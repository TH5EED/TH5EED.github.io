<svg viewBox="0 0 680 596" xmlns="http://www.w3.org/2000/svg" width="100%" role="img">
  <title>GitLab 在 CI/CD 流水线中的角色</title>
  <desc>从开发者 push 代码到 K8s 集群滚动更新的完整 CI/CD 数据流，GitLab 同时承担代码仓库和 K8s 清单仓库双重角色</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .th { font: 500 14px var(--font-sans, sans-serif); }
    .ts { font: 400 12px var(--font-sans, sans-serif); }
  </style>

  <!-- Developer -->
  <g>
    <rect x="230" y="40" width="220" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text class="th" x="340" y="62" text-anchor="middle" dominant-baseline="central" fill="#444441">Developer (git push)</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M340 84 L340 120" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="352" y="102" dominant-baseline="central" fill="#888780">push 代码</text>

  <!-- GitLab (HIGHLIGHTED) -->
  <g>
    <rect x="230" y="120" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
    <text class="th" x="340" y="138" text-anchor="middle" dominant-baseline="central" fill="#3C3489">GitLab</text>
    <text class="ts" x="340" y="158" text-anchor="middle" dominant-baseline="central" fill="#534AB7">代码仓库 + Webhook + Manifest 仓库</text>
  </g>
  <text class="ts" x="222" y="148" text-anchor="end" dominant-baseline="central" fill="#534AB7">本次部署 →</text>

  <!-- Arrow 2 -->
  <path d="M340 176 L340 220" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="352" y="198" dominant-baseline="central" fill="#888780">webhook 触发</text>

  <!-- Jenkins -->
  <g>
    <rect x="230" y="220" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="th" x="340" y="238" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Jenkins</text>
    <text class="ts" x="340" y="258" text-anchor="middle" dominant-baseline="central" fill="#185FA5">单测 + 构建 Docker 镜像</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M340 276 L340 320" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="352" y="298" dominant-baseline="central" fill="#888780">push 镜像</text>

  <!-- Harbor -->
  <g>
    <rect x="230" y="320" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="th" x="340" y="338" text-anchor="middle" dominant-baseline="central" fill="#085041">Harbor</text>
    <text class="ts" x="340" y="358" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">镜像仓库 + Trivy 安全扫描</text>
  </g>

  <!-- Arrow 4 -->
  <path d="M340 376 L340 420" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="352" y="398" dominant-baseline="central" fill="#888780">更新 manifest tag</text>

  <!-- ArgoCD -->
  <g>
    <rect x="230" y="420" width="220" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text class="th" x="340" y="438" text-anchor="middle" dominant-baseline="central" fill="#633806">ArgoCD</text>
    <text class="ts" x="340" y="458" text-anchor="middle" dominant-baseline="central" fill="#854F0B">GitOps 监听清单仓库</text>
  </g>

  <!-- Arrow 5 -->
  <path d="M340 476 L340 520" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="352" y="498" dominant-baseline="central" fill="#888780">sync 到集群</text>

  <!-- K8s Cluster -->
  <g>
    <rect x="230" y="520" width="220" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
    <text class="th" x="340" y="538" text-anchor="middle" dominant-baseline="central" fill="#27500A">K8s Cluster</text>
    <text class="ts" x="340" y="558" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">Deployment 滚动更新</text>
  </g>

  <!-- GitOps loop: ArgoCD → GitLab -->
  <path d="M450 448 C530 448, 530 148, 450 148" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text class="ts" x="560" y="298" text-anchor="middle" dominant-baseline="central" fill="#534AB7">GitOps 监听</text>
</svg>
