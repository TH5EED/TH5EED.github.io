<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="24" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">CI/CD 流水线中 Harbor 的定位</text>

  <g>
    <rect x="240" y="40" width="200" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="340" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">GitLab</text>
    <text x="340" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#633806">源码仓库 / 触发 CI</text>
  </g>
  <line x1="340" y1="96" x2="340" y2="138" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="352" y="118" font-family="sans-serif" font-size="11" fill="#888780">push / webhook</text>

  <g>
    <rect x="240" y="140" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="340" y="162" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Jenkins</text>
    <text x="340" y="180" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0C447C">CI: 编译 + docker build</text>
  </g>
  <line x1="340" y1="196" x2="340" y2="238" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="352" y="220" font-family="sans-serif" font-size="11" fill="#888780">docker push</text>

  <g>
    <rect x="240" y="240" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
    <text x="340" y="262" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Harbor</text>
    <text x="340" y="280" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">镜像仓库: 存储+扫描+RBAC</text>
  </g>

  <g>
    <rect x="40" y="248" width="150" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="115" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#042C53">开发者 / CI push</text>
    <text x="115" y="286" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0C447C">手动/自动推送镜像</text>
  </g>
  <line x1="190" y1="270" x2="238" y2="270" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="470" y="248" width="170" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="555" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#412402">Trivy 漏洞扫描</text>
    <text x="555" y="286" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#633806">内置, push 时自动扫</text>
  </g>
  <line x1="442" y1="270" x2="468" y2="270" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="340" y1="296" x2="340" y2="338" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="352" y="320" font-family="sans-serif" font-size="11" fill="#888780">ArgoCD 拉取 image</text>

  <g>
    <rect x="240" y="340" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="340" y="362" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">ArgoCD</text>
    <text x="340" y="380" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">CD: GitOps 同步 manifests</text>
  </g>
  <line x1="340" y1="396" x2="340" y2="438" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="352" y="420" font-family="sans-serif" font-size="11" fill="#888780">kubelet pull</text>

  <g>
    <rect x="240" y="440" width="200" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
