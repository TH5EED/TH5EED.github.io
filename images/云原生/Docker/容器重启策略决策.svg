<svg xmlns="http://www.w3.org/2000/svg" width="980" height="580" viewBox="0 0 980 580">
  <style>
    text { font-family: 'Microsoft YaHei','PingFang SC',sans-serif; }
    .title { font-size: 23px; font-weight: bold; fill: #1f2d3d; }
    .h { font-size: 13.5px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
    .badge { font-size: 15px; font-weight: bold; fill: #ffffff; text-anchor: middle; font-family: Consolas,monospace; }
    .bd { font-size: 13.5px; fill: #1f2d3d; }
    .note { font-size: 12px; fill: #777777; }
    .key { font-size: 14px; font-weight: bold; fill: #b9770e; }
  </style>

  <rect width="980" height="580" fill="#ffffff"/>
  <text x="490" y="40" text-anchor="middle" class="title">容器重启策略：主进程退出后，Docker 怎么办？</text>

  <!-- 表头 -->
  <rect x="240" y="64" width="150" height="30" rx="4" fill="#34495e"/>
  <text x="315" y="84" class="h">策略 --restart</text>
  <rect x="405" y="64" width="300" height="30" rx="4" fill="#34495e"/>
  <text x="555" y="84" class="h">触发条件</text>
  <rect x="720" y="64" width="230" height="30" rx="4" fill="#34495e"/>
  <text x="835" y="84" class="h">结果</text>

  <!-- 源事件 -->
  <rect x="30" y="230" width="180" height="76" rx="8" fill="#2c3e50"/>
  <text x="120" y="262" class="h">容器主进程退出</text>
  <text x="120" y="284" font-size="11.5" fill="#bdc3c7" text-anchor="middle">（PID 1 结束）</text>

  <line x1="210" y1="268" x2="228" y2="268" stroke="#7f8c8d" stroke-width="2"/>
  <line x1="228" y1="135" x2="228" y2="410" stroke="#7f8c8d" stroke-width="2"/>
  <line x1="228" y1="135" x2="240" y2="135" stroke="#7f8c8d" stroke-width="2"/>
  <line x1="228" y1="222" x2="240" y2="222" stroke="#7f8c8d" stroke-width="2"/>
  <line x1="228" y1="317" x2="240" y2="317" stroke="#7f8c8d" stroke-width="2"/>
  <line x1="228" y1="410" x2="240" y2="410" stroke="#7f8c8d" stroke-width="2"/>

  <!-- no -->
  <rect x="240" y="106" width="150" height="58" rx="6" fill="#95a5a6"/>
  <text x="315" y="142" class="badge">no（默认）</text>
  <rect x="405" y="106" width="300" height="58" rx="6" fill="#f8f9fa" stroke="#95a5a6"/>
  <text x="419" y="140" class="bd">无论退出码是什么，都不管</text>
  <rect x="720" y="106" width="230" height="58" rx="6" fill="#f8f9fa" stroke="#95a5a6"/>
  <text x="734" y="132" class="bd">容器 Exited，到此为止</text>
  <text x="734" y="152" class="note">docker 服务重启后也不会拉起</text>

  <!-- on-failure -->
  <rect x="240" y="193" width="150" height="58" rx="6" fill="#e67e22"/>
  <text x="315" y="222" class="badge">on-failure</text>
  <text x="315" y="240" font-size="11" fill="#ffffff" text-anchor="middle">[:最大次数]</text>
  <rect x="405" y="193" width="300" height="58" rx="6" fill="#fef5ec" stroke="#e67e22"/>
  <text x="419" y="218" class="bd">仅当退出码 ≠ 0 才重启</text>
  <text x="419" y="238" class="note">可写 on-failure:5 限制最多重试 5 次</text>
  <rect x="720" y="193" width="230" height="58" rx="6" fill="#fef5ec" stroke="#e67e22"/>
  <text x="734" y="218" class="bd">非 0 → 重启；退出码 0 → 不重启</text>
  <text x="734" y="238" class="note">适合批处理 / 一次性任务</text>

  <!-- always -->
  <rect x="240" y="288" width="150" height="58" rx="6" fill="#2e86c1"/>
  <text x="315" y="323" class="badge">always</text>
  <rect x="405" y="288" width="300" height="58" rx="6" fill="#eaf2f8" stroke="#2e86c1"/>
  <text x="419" y="313" class="bd">无论退出码是什么，一律重启</text>
  <text x="419" y="333" class="note">docker 服务重启后也会自动拉起</text>
  <rect x="720" y="288" width="230" height="58" rx="6" fill="#eaf2f8" stroke="#2e86c1"/>
  <text x="734" y="313" class="bd">永远保持运行</text>
  <text x="734" y="333" class="note">包括你手动 stop 过的，宿主机重启后也复活</text>

  <!-- unless-stopped -->
  <rect x="240" y="381" width="150" height="58" rx="6" fill="#27ae60"/>
  <text x="315" y="404" class="badge">unless-</text>
  <text x="315" y="424" class="badge">stopped</text>
  <rect x="405" y="381" width="300" height="58" rx="6" fill="#eafaf1" stroke="#27ae60"/>
  <text x="419" y="406" class="bd">行为同 always，但尊重你的手动停止</text>
  <text x="419" y="426" class="note">你 docker stop 过的，就不再自动拉起</text>
  <rect x="720" y="381" width="230" height="58" rx="6" fill="#eafaf1" stroke="#27ae60"/>
  <text x="734" y="406" class="bd">崩溃自动重启</text>
  <text x="734" y="426" class="note">但手动 stop 的容器不会被复活</text>

  <!-- 关键点 -->
  <rect x="30" y="468" width="920" height="88" rx="8" fill="#fef9e7" stroke="#f39c12"/>
  <text x="46" y="494" class="key">面试关键点：always 和 unless-stopped 的唯一区别</text>
  <text x="46" y="518" font-size="13.5" fill="#555555">Docker 服务（daemon）重启后：always 会复活「之前被手动 docker stop 的容器」；unless-stopped 不会。</text>
  <text x="46" y="540" font-size="13.5" fill="#555555">实践建议：长期服务首选 unless-stopped —— 既要崩溃自愈，又不想被「我明明停了它」背刺。</text>
</svg>
