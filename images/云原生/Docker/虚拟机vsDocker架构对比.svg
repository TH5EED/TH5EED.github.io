<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620">
  <style>
    text { font-family: 'Microsoft YaHei','PingFang SC',sans-serif; }
    .title { font-size: 24px; font-weight: bold; fill: #1f2d3d; }
    .panel { font-size: 19px; font-weight: bold; }
    .bt { font-size: 14px; fill: #ffffff; text-anchor: middle; }
    .bts { font-size: 12.5px; fill: #ffffff; text-anchor: middle; }
    .dt { font-size: 13.5px; fill: #1f2d3d; text-anchor: middle; }
    .note { font-size: 13.5px; fill: #555555; }
    .noteb { font-size: 14px; font-weight: bold; }
    .small { font-size: 12px; fill: #777777; }
  </style>

  <rect width="980" height="620" fill="#ffffff"/>
  <text x="490" y="40" text-anchor="middle" class="title">虚拟机 vs Docker 容器：架构对比</text>

  <line x1="490" y1="70" x2="490" y2="545" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- ================= 左侧：虚拟机 ================= -->
  <text x="245" y="78" text-anchor="middle" class="panel" fill="#c0392b">虚拟机（硬件级虚拟化）</text>

  <!-- VM 1 -->
  <rect x="45" y="96" width="122" height="282" fill="none" stroke="#c0392b" stroke-width="2" rx="6"/>
  <rect x="53" y="106" width="106" height="44" rx="4" fill="#e67e22"/>
  <text x="106" y="133" class="bt">应用 App</text>
  <rect x="53" y="156" width="106" height="44" rx="4" fill="#f39c12"/>
  <text x="106" y="183" class="bt">依赖 / 类库</text>
  <rect x="53" y="206" width="106" height="162" rx="4" fill="#c0392b"/>
  <text x="106" y="278" class="bt">Guest OS</text>
  <text x="106" y="298" class="bts">独立完整的内核</text>

  <!-- VM 2 -->
  <rect x="184" y="96" width="122" height="282" fill="none" stroke="#c0392b" stroke-width="2" rx="6"/>
  <rect x="192" y="106" width="106" height="44" rx="4" fill="#e67e22"/>
  <text x="245" y="133" class="bt">应用 App</text>
  <rect x="192" y="156" width="106" height="44" rx="4" fill="#f39c12"/>
  <text x="245" y="183" class="bt">依赖 / 类库</text>
  <rect x="192" y="206" width="106" height="162" rx="4" fill="#c0392b"/>
  <text x="245" y="278" class="bt">Guest OS</text>
  <text x="245" y="298" class="bts">独立完整的内核</text>

  <!-- VM 3 -->
  <rect x="323" y="96" width="122" height="282" fill="none" stroke="#c0392b" stroke-width="2" rx="6"/>
  <rect x="331" y="106" width="106" height="44" rx="4" fill="#e67e22"/>
  <text x="384" y="133" class="bt">应用 App</text>
  <rect x="331" y="156" width="106" height="44" rx="4" fill="#f39c12"/>
  <text x="384" y="183" class="bt">依赖 / 类库</text>
  <rect x="331" y="206" width="106" height="162" rx="4" fill="#c0392b"/>
  <text x="384" y="278" class="bt">Guest OS</text>
  <text x="384" y="298" class="bts">独立完整的内核</text>

  <rect x="30" y="398" width="430" height="52" rx="6" fill="#8e44ad"/>
  <text x="245" y="430" class="bt">Hypervisor 虚拟机监控器（VMware ESXi / KVM / Hyper-V / Xen）</text>

  <rect x="30" y="462" width="430" height="48" rx="6" fill="#7f8c8d"/>
  <text x="245" y="491" class="bt">物理硬件（CPU / 内存 / 磁盘 / 网卡）</text>

  <text x="245" y="536" text-anchor="middle" class="note">每个 VM 都带一套完整操作系统 →</text>
  <text x="245" y="556" text-anchor="middle" class="noteb" fill="#c0392b">分钟级启动 · GB 级体积 · 隔离强 · 密度低</text>

  <!-- ================= 右侧：Docker ================= -->
  <text x="735" y="78" text-anchor="middle" class="panel" fill="#27ae60">Docker 容器（操作系统级虚拟化）</text>

  <!-- C 1 -->
  <rect x="535" y="96" width="122" height="106" fill="none" stroke="#27ae60" stroke-width="2" rx="6"/>
  <rect x="543" y="106" width="106" height="42" rx="4" fill="#e67e22"/>
  <text x="596" y="132" class="bt">应用 App</text>
  <rect x="543" y="152" width="106" height="42" rx="4" fill="#f39c12"/>
  <text x="596" y="178" class="bt">依赖 / 类库</text>

  <!-- C 2 -->
  <rect x="674" y="96" width="122" height="106" fill="none" stroke="#27ae60" stroke-width="2" rx="6"/>
  <rect x="682" y="106" width="106" height="42" rx="4" fill="#e67e22"/>
  <text x="735" y="132" class="bt">应用 App</text>
  <rect x="682" y="152" width="106" height="42" rx="4" fill="#f39c12"/>
  <text x="735" y="178" class="bt">依赖 / 类库</text>

  <!-- C 3 -->
  <rect x="813" y="96" width="122" height="106" fill="none" stroke="#27ae60" stroke-width="2" rx="6"/>
  <rect x="821" y="106" width="106" height="42" rx="4" fill="#e67e22"/>
  <text x="874" y="132" class="bt">应用 App</text>
  <rect x="821" y="152" width="106" height="42" rx="4" fill="#f39c12"/>
  <text x="874" y="178" class="bt">依赖 / 类库</text>

  <text x="735" y="228" text-anchor="middle" class="noteb" fill="#27ae60">容器里没有 Guest OS！进程直接跑在宿主内核上</text>
  <text x="735" y="248" text-anchor="middle" class="small">隔离 = Namespace（视图隔离） + Cgroups（资源限额）</text>

  <rect x="520" y="266" width="430" height="52" rx="6" fill="#16a085"/>
  <text x="735" y="298" class="bt">容器引擎（dockerd / containerd / CRI-O）</text>

  <rect x="520" y="330" width="430" height="52" rx="6" fill="#2980b9"/>
  <text x="735" y="356" class="bt">宿主操作系统内核（Linux Kernel）</text>
  <text x="735" y="374" class="bts">所有容器共享同一个内核</text>

  <rect x="520" y="462" width="430" height="48" rx="6" fill="#7f8c8d"/>
  <text x="735" y="491" class="bt">物理硬件（CPU / 内存 / 磁盘 / 网卡）</text>

  <text x="735" y="536" text-anchor="middle" class="note">共享宿主内核，只打包应用与依赖 →</text>
  <text x="735" y="556" text-anchor="middle" class="noteb" fill="#27ae60">秒级启动 · MB 级体积 · 隔离较弱 · 密度高</text>

  <!-- 底部结论条 -->
  <rect x="30" y="576" width="920" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="490" y="600" text-anchor="middle" class="noteb" fill="#1f2d3d">本质区别只有一个：是否拥有独立的操作系统内核 —— 它决定了启动速度、资源开销与隔离强度</text>
</svg>
